/* =====================================================
   MUTALAAH
===================================================== */

let indexMutalaah = 0;

function tampilMutalaah(){

    let item = data[indexMutalaah];

    document.getElementById("counterMutalaah").innerText =
        (indexMutalaah + 1) + " / " + data.length;

    document.getElementById("arabicMutalaah").innerText =
        item.arabic;

    document.getElementById("meaningMutalaah").innerText =
        item.meaning;

    let html = "";

    item.examples.forEach((contoh,i)=>{

        html += `
        <div class="example">

            <b>Contoh ${i+1}</b>

            <div class="example-arabic">
                ${contoh[0]}
            </div>

            <div class="translation">
                ${contoh[1]}
            </div>

        </div>
        `;

    });

    document.getElementById("examples").innerHTML = html;
}

function nextMaterial(){

    indexMutalaah++;

    if(indexMutalaah >= data.length){
        indexMutalaah = 0;
    }

    tampilMutalaah();
}

function previousMaterial(){

    indexMutalaah--;

    if(indexMutalaah < 0){
        indexMutalaah = data.length - 1;
    }

    tampilMutalaah();
}

    }

}


/* =====================================================
   TAB
===================================================== */

function openTab(number){

    document.querySelectorAll(".panel")
        .forEach(panel => panel.classList.remove("active"));

    document.querySelectorAll(".tabs button")
        .forEach(button => button.classList.remove("active"));

    document.getElementById("panel"+number)
        .classList.add("active");

    document.getElementById("tab"+number)
        .classList.add("active");

    if(number === 1){
        tampilMutalaah();
    }

    if(number === 2){
        tampilLalar();
    }

    if(number === 3){
        mulaiTes();
    }
}


/* =====================================================
   TES
===================================================== */

let nomorSoal = 0;
let nilai = 0;
let soalTes = [];
let tesSudahMulai = false;

function mulaiTes(){

    if(tesSudahMulai){
        return;
    }

    tesSudahMulai = true;

    soalTes = [...data]
        .sort(()=>Math.random()-0.5)
        .slice(0,20);

    tampilSoal();
}

function tampilSoal(){

    if(nomorSoal >= 20){

        document.getElementById("counterTes").innerText =
            "Tes selesai";

        document.getElementById("question").innerHTML = "";

        document.getElementById("result")
            .classList.remove("hidden");

        document.getElementById("result").innerHTML = `

            <div>Nilai Kamu</div>

            <div class="score">
                ${nilai} / 20
            </div>

            <p>
                ${
                    nilai >= 18
                    ? "MasyaAllah, sangat bagus! 🌟"
                    : nilai >= 15
                    ? "Bagus! Tinggal lebih sering murajaah. 👍"
                    : nilai >= 10
                    ? "Lumayan. Mutalaah dan ngelalar lagi. 📚"
                    : "Tidak apa-apa. Ulangi materi sampai hafal. 💪"
                }
            </p>

            <button
                class="main-button"
                onclick="ulangTes()">
                🔄 Ulangi Tes
            </button>

        `;

        return;
    }


    let item = soalTes[nomorSoal];

    document.getElementById("counterTes").innerText =
        "Soal " + (nomorSoal + 1) + " / 20";


    let pilihan = [item.meaning];


    while(pilihan.length < 4){

        let acak =
            data[Math.floor(Math.random()*data.length)].meaning;

        if(!pilihan.includes(acak)){
            pilihan.push(acak);
        }

    }


    pilihan.sort(()=>Math.random()-0.5);


    let html = `

        <div class="arabic">
            ${item.arabic}
        </div>

        <p style="text-align:center">
            Apa arti uslub di atas?
        </p>

        <div class="options">

    `;


    pilihan.forEach((p)=>{

        html += `

            <label>
                <input
                    type="radio"
                    name="jawaban"
                    value="${p}">
                ${p}
            </label>

        `;

    });


    html += `

        </div>

        <button
            class="main-button"
            onclick="jawab()">
            Jawab
        </button>

    `;


    document.getElementById("question").innerHTML = html;

}


function jawab(){

    let pilihan =
        document.querySelector(
            'input[name="jawaban"]:checked'
        );


    if(!pilihan){

        alert("Pilih jawaban dulu.");

        return;
    }


    if(
        pilihan.value ===
        soalTes[nomorSoal].meaning
    ){

        nilai++;

    }


    nomorSoal++;

    tampilSoal();

}


function ulangTes(){

    nomorSoal = 0;

    nilai = 0;

    tesSudahMulai = false;

    soalTes = [];

    document.getElementById("result")
        .classList.add("hidden");

    mulaiTes();

}
